[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-guard"
version = "0.1.0"
description = "Rail-relative, class-agnostic LiDAR obstacle detection and auditable bag evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "rosbags==0.11.5", "kiss-icp==1.3.0", "open3d==0.19.0", "threadpoolctl==3.7.0"]

[project.optional-dependencies]
comparison = ["travel-seg==1.1.0", "hdbscan==0.8.44", "pypatchworkpp==1.1.0"]

[project.scripts]
tunnel-guard = "tunnel_guard.run:main"
tunnel-guard-evaluate = "tunnel_guard.evaluate:main"

[tool.setuptools.packages.find]
include = ["tunnel_guard*"]

[tool.setuptools.package-data]
tunnel_guard = ["review.html"]
